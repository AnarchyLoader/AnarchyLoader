[package]
name = "anarchyloader"
version = "2.0.0"
edition = "2021"
build = "build.rs"
authors = ["dest4590"]

[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
url = "2.5.8"

eframe = "0.36.1"
egui = { version = "0.36.1", features = ["serde"] }
egui_dnd = "0.17.0"
egui_alignments = { path = "vendor/egui_alignments/crates/egui_alignments" }

egui_commonmark = "0.25.0"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
egui_material_icons = "0.8.0"
egui-notify = { path = "vendor/egui-notify" }
egui-theme-switch = "0.9.0"

discord-rich-presence = "1.1.0"
image = { version = "0.25.10", features = ["png"] }
is_elevated = "0.1.2"
log = { version = "0.4.34", features = ["serde"] }
opener = "0.8.5"
pelite = { version = "0.10.0", optional = true }
proc_mem = "0.1.6"
rand = "0.10.2"
regex = { version = "1.13.1", optional = true }
rfd = "0.17.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
sysinfo = "0.39.6"
ureq = { version = "3.4.0", features = ["json"] }
vdf-reader = "0.3.4"
whoami = "2.1.3"
zip-extract = "0.4.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[build-dependencies]
winres = "0.1.12"

[profile.release]
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
lto = true
